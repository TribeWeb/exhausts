testimonials:
  title: Join our list of [delighted]{.text-primary} customers
  description: See how our customers have transformed their car for the ultimate driving experience
  items:
    - quote: Robin is a great guy, really genuine and cares about what he does. He did a cat back exhaust on my SLK350. Top quality welding and stainless steel used and just a top quality job done overall. He gave me tonnes of info regarding different options based on what I was looking for, he always got back to me quickly, did the job in the time he estimated and I would highly recommend him personally.  Thanks again Robin. My SLK comes to you forever from here on out.
      user:
        name: Joshua Fortune
        description: Mercedes SLK
        target: _blank
        avatar:
          src: ""
    - quote: Robin is a lovely lad who takes massive pride in his work. Beautiful welding and premium stainless steel materials. Left my car sounding exactly how I requested and couldn’t be happier 😁
      user:
        name: Jake Sims
        description: BMW M5
        target: _blank
        avatar:
          src: ""
    - quote: Great find. They did a great job fitting a stainless steel exhaust to my old Mercedes Estate. The job was done on time and too budget. They also took time to show me the work that was undertaken and check I was happy. I think my old Merc’s might be going a bit more often!
      user:
        name: Mark Browne
        description: Mercedes
        target: _blank
